{% extends "app/base.html" %}
{% block title %}Entrar{% endblock %}
{% block content %}
<div class="auth-box">
    <h2>Entrar</h2>
    <form method="post">
        {% csrf_token %}
        {% for field in form %}
        <div class="mb-3">
            <label class="form-label">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <div class="text-danger small mt-1">{{ field.errors|striptags }}</div>
            {% endif %}
        </div>
        {% endfor %}
        <button type="submit" class="btn-cine w-100">Entrar</button>
    </form>
    <p class="mt-3 text-center">Não tem conta? <a href="{% url 'app:registrar' %}">Criar conta</a></p>
</div>
{% endblock %}
