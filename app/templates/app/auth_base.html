<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#241225">
    <title>{% block title %}CineSul{% endblock %}</title>
    <link rel="icon" type="image/png" href="{% static 'app/favicon.png' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="{% static 'app/estilo.css' %}" rel="stylesheet">
    <style>
        .auth-wrap {
            min-height: 100vh;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
            align-items: center;
            gap: 4rem;
            max-width: 1080px;
            margin: 0 auto;
            padding: 2rem;
        }
        .auth-marca {
            display: flex; align-items: center; gap: 10px;
            font-family: var(--fonte-titulo); font-size: 1.6rem;
            margin-bottom: 2.5rem;
        }
        .auth-marca i { color: var(--cinema-red); }
        .auth-hero h1 { font-size: clamp(2rem, 4.4vw, 3.2rem); margin: 0 0 1rem; }
        .auth-hero p { max-width: 44ch; font-size: 1.08rem; }
        .auth-lista { list-style: none; padding: 0; margin: 1.6rem 0 0; display: grid; gap: .7rem; max-width: 44ch; }
        .auth-lista li { position: relative; padding-left: 1.2rem; color: var(--cinema-text); }
        .auth-lista li::before {
            content: ""; position: absolute; left: 0; top: .65em;
            width: 6px; height: 6px; border-radius: 50%; background: var(--latao);
        }

        .auth-card { background: var(--cinema-card); border-radius: 8px; padding: 2rem; }
        .auth-card h2 { font-size: 1.5rem; margin: 0 0 .3rem; }
        .auth-sub { margin: 0 0 1.4rem; font-size: .95rem; }

        .auth-field { margin-bottom: 1rem; }
        .auth-field label { display: block; font-size: .9rem; font-weight: 600; margin-bottom: 6px; }
        .auth-field input {
            width: 100%; background: var(--cinema-bg); border: 1px solid var(--linha);
            color: var(--cinema-text); border-radius: var(--raio); padding: 11px 14px; font-size: 1rem;
        }
        .auth-field input:focus { outline: none; border-color: var(--cinema-red); }
        .auth-help { font-size: .82rem; color: var(--cinema-text-muted); margin-top: 5px; }
        .auth-help ul { padding-left: 1.1rem; margin: 4px 0 0; }
        .auth-error { color: #ff9aa6; font-size: .85rem; margin-top: 5px; }
        .auth-alert { background: #4b1822; color: #ffd9de; border-radius: var(--raio); padding: 10px 14px; font-size: .92rem; margin-bottom: 1rem; }

        .btn-bloco { width: 100%; padding: 12px; }
        .auth-divider { display: flex; align-items: center; gap: 12px; color: var(--cinema-text-muted); font-size: .9rem; margin: 1.3rem 0; }
        .auth-divider::before, .auth-divider::after { content: ""; flex: 1; height: 1px; background: var(--linha); }
        .auth-note { font-size: .85rem; margin: .7rem 0 0; }
        .auth-switch { margin: 1.4rem 0 0; font-size: .95rem; }

        @media (max-width: 900px) {
            .auth-wrap { grid-template-columns: minmax(0, 1fr); gap: 1.6rem; padding: 1.2rem; align-content: center; }
            .auth-marca { margin-bottom: 1.2rem; }
            .auth-hero h1 { font-size: 1.7rem; }
            .auth-hero p, .auth-lista { display: none; }
        }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
</body>
</html>
