{% extends "app/base.html" %}
{% block title %}Temporadas{% endblock %}
{% block content %}
<h2 class="mb-3">Temporadas</h2>
<table class="table table-striped table-bordered">
    <thead class="table-dark"><tr><th>Série</th><th>Número</th></tr></thead>
    <tbody>
        {% for t in temporadas %}
        <tr><td>{{ t.serie.nome }}</td><td>{{ t.numero }}ª Temporada</td></tr>
        {% empty %}
        <tr><td colspan="2" class="text-center">Nenhuma temporada cadastrada.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
