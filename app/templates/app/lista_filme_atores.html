{% extends "app/base.html" %}
{% block title %}Filmes e Atores{% endblock %}
{% block content %}
<h2 class="mb-3">Filmes com seus Atores</h2>
<table class="table table-striped table-bordered">
    <thead class="table-dark">
        <tr><th>Filme</th><th>Ator</th><th>Personagem</th></tr>
    </thead>
    <tbody>
        {% for r in relacoes %}
        <tr>
            <td>{{ r.filme.nome }}</td>
            <td>{{ r.ator.nome }}</td>
            <td>{{ r.personagem|default:"-" }}</td>
        </tr>
        {% empty %}
        <tr><td colspan="3" class="text-center">Nenhum registro.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
