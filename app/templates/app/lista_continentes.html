{% extends "app/base.html" %}
{% block title %}Continentes{% endblock %}
{% block content %}
<h2 class="mb-3">Continentes (RF10)</h2>
<table class="table table-striped table-bordered">
    <thead class="table-dark"><tr><th>Nome</th></tr></thead>
    <tbody>
        {% for c in continentes %}
        <tr><td>{{ c.nome }}</td></tr>
        {% empty %}
        <tr><td class="text-center">Nenhum continente cadastrado.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
