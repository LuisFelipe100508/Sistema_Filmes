{% extends "app/base.html" %}
{% block title %}Países{% endblock %}
{% block content %}
<h2 class="mb-3">Países</h2>
<table class="table table-striped table-bordered">
    <thead class="table-dark"><tr><th>Nome</th><th>Continente</th></tr></thead>
    <tbody>
        {% for p in paises %}
        <tr><td>{{ p.nome }}</td><td>{{ p.continente.nome }}</td></tr>
        {% empty %}
        <tr><td colspan="2" class="text-center">Nenhum país cadastrado.</td></tr>
        {% endfor %}
    </tbody>
</table>
{% endblock %}
