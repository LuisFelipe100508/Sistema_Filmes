{% if page_obj.paginator.num_pages > 1 %}
<nav class="paginacao" aria-label="Paginação">
    {% if page_obj.has_previous %}
    <a href="{% querystring page=page_obj.previous_page_number %}" class="pg-seta" rel="prev"><i class="bi bi-chevron-left"></i><span>Anterior</span></a>
    {% endif %}

    <div class="pg-numeros">
        {% for n in janela %}
            {% if n %}
            <a href="{% querystring page=n %}" class="{% if n == page_obj.number %}ativo{% endif %}" {% if n == page_obj.number %}aria-current="page"{% endif %}>{{ n }}</a>
            {% else %}
            <span class="pg-reticencias">…</span>
            {% endif %}
        {% endfor %}
    </div>

    {% if page_obj.has_next %}
    <a href="{% querystring page=page_obj.next_page_number %}" class="pg-seta" rel="next"><span>Próxima</span><i class="bi bi-chevron-right"></i></a>
    {% endif %}
</nav>
{% endif %}
