<!DOCTYPE html>
{% load static %}
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Sistema de Filmes e Séries{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="{% url 'app:index' %}">🎬 Filmes &amp; Séries</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="{% url 'app:lista_filmes' %}">Filmes</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'app:lista_filme_atores' %}">Filmes/Atores</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'app:lista_series' %}">Séries</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'app:lista_temporadas' %}">Temporadas</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'app:lista_episodios' %}">Episódios</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'app:lista_generos' %}">Gêneros</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'app:lista_pessoas' %}">Atores/Diretores</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'app:lista_paises' %}">Países</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'app:lista_continentes' %}">Continentes</a></li>
                </ul>
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/admin">Admin</a></li>
                </ul>
            </div>
        </div>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
